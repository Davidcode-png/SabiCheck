# Render Blueprint for the SabiCheck backend.
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repository.
#
# The database is hosted on Neon (https://neon.tech), not on Render.
# Set both DATABASE_URL_* values manually in the Render dashboard using the
# Neon connection details. Use Neon's DIRECT connection string (the host
# without "-pooler"), because asyncpg does not work with PgBouncer's
# transaction mode unless prepared statements are disabled.
#
# Sync URL  (Alembic / psycopg):
#   postgresql://USER:PASSWORD@ep-xxx.REGION.aws.neon.tech/DBNAME?sslmode=require
# Async URL (FastAPI / asyncpg):
#   postgresql+asyncpg://USER:PASSWORD@ep-xxx.REGION.aws.neon.tech/DBNAME?ssl=require

services:
  - type: web
    name: sabicheck-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DATABASE_URL_ASYNC
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash
      - key: GEMINI_MODEL_COOLDOWN_SECONDS
        value: "60"
