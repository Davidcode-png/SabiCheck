# Render Blueprint for the SabiCheck backend.
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repository.
#
# NOTE: Render cannot automatically convert the database URL to the asyncpg
# driver, so DATABASE_URL_ASYNC must be filled in manually after the first
# deploy (copy DATABASE_URL_SYNC and change the prefix to
# postgresql+asyncpg:// and sslmode=require to ssl=require).

services:
  - type: web
    name: sabicheck-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: sabicheck-db
          property: connectionString
      - key: DATABASE_URL_ASYNC
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: sabicheck-db
    plan: free
    databaseName: sabicheck
    user: sabicheck
